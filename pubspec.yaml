name: snake_case
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.14.0


dependencies: # การกำหนดหรือบอกว่าเราติดตั้งแพคเกจไหนบ้าง
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  google_fonts: ^9.0.0  #ฟอน
  font_awesome_flutter: ^11.0.0


dev_dependencies: # การกำหนดหรือบอกว่าเราติดตั้งแพคเกจไหนบ้าง
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  

  
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21   


flutter:
  uses-material-design: true
  # ตั้งค่ารูปภาพในโปรเจต
  assets:
    - assets/images/



 